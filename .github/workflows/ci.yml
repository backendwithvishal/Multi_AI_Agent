name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Linter & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Verify Image & Registry Pins
        run: |
          python scripts/verify_pins.py

      - name: Run Test Suite
        env:
          APP_ENV: test
          SKIP_DOCKER_SMOKE_IN_PYTEST: "true"
        run: |
          python -m pytest -v --tb=short 2>&1 | tee pytest_output.txt || {
            echo "### Pytest Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 pytest_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

  docker-build:
    name: Verify Docker Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: '3.11'

      - name: Verify Image & Registry Pins
        run: |
          python scripts/verify_pins.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0

      - name: Build Docker Image
        run: |
          docker build --no-cache -t multi-ai-agent:test .

      - name: Test Container Non-Root User
        run: |
          docker run --rm multi-ai-agent:test id | grep -v 'uid=0(root)'

      - name: Test Container Startup & Health Probes
        run: |
          docker run -d --name test_app \
            -e PORT=10000 \
            -e APP_ENV=production \
            -e SECRET_KEY=ci_dummy_secret_key_32_characters_long \
            -e API_KEY=ci_dummy_api_key_24_chars \
            -e GROQ_API_KEY=gsk_ci_dummy_key_mock_for_smoke_test \
            -p 10000:10000 multi-ai-agent:test
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:10000/health/live >/dev/null 2>&1; then
              echo "App is live and healthy!"
              break
            fi
            sleep 1
          done
          docker logs test_app
          curl -f http://127.0.0.1:10000/health/live
          # Verify readiness endpoint reports 503 degraded gracefully instead of crashing
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:10000/health/ready || true)
          echo "Readiness HTTP status: $STATUS"
          [ "$STATUS" = "503" ] || [ "$STATUS" = "200" ]
          docker stop test_app && docker rm test_app

  deploy:
    name: Trigger Render Deployment
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Webhook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deploy hook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            echo "Render deploy hook returned HTTP status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "Deployment triggered successfully on Render."
            else
              echo "Deploy hook request failed with status: $HTTP_STATUS"
              exit 1
            fi
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not defined. Skipping explicit webhook trigger."
            echo "Render will auto-deploy via GitHub integration if Auto-Deploy is enabled in Render settings."
          fi
