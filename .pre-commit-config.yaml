# .pre-commit-config.yaml
# Automates image pin verification on pre-commit
repos:
  - repo: local
    hooks:
      - id: verify-image-pins
        name: Verify Pinned Image Digests
        entry: python scripts/verify_pins.py
        language: system
        files: ^(Dockerfile.*|docker-compose.*\.ya?ml|\.github/workflows/.*\.ya?ml)$
        pass_filenames: false
